<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MQTT alert</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; gap: 10px; padding: 14px; box-sizing: border-box; }
    #gif { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: contain; }
    #title { margin: 0; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
    #payload { margin: 0; max-height: 7.5em; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
               font: 13px/1.5 ui-monospace, Consolas, monospace; background: var(--surface); padding: 8px; border-radius: 6px; }
    #meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #countdown { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <img id="gif" alt="" hidden>
  <h1 id="title"></h1>
  <pre id="payload"></pre>
  <div id="meta"></div>
  <footer>
    <span id="countdown"></span>
    <button id="dismiss" class="primary">Dismiss</button>
  </footer>
  <script type="module" src="alert.js"></script>
</body>
</html>
